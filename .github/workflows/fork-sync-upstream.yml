name: Fork Sync Upstream

# Fork-only. Keeps `main` a mirror of upstream and rebases `fork` onto it; see FORK.md.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a nightly when the fork branch moved"
        required: false
        default: true
        type: boolean

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code

jobs:
  sync:
    name: Mirror main and rebase fork
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      # GITHUB_TOKEN may not push commits that touch .github/workflows, and
      # upstream changes those often, so both pushes go through a deploy key.
      - name: Require the deploy key
        env:
          FORK_SYNC_DEPLOY_KEY: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
        run: |
          if [[ -z "$FORK_SYNC_DEPLOY_KEY" ]]; then
            echo "Set the FORK_SYNC_DEPLOY_KEY secret to a write deploy key. See FORK.md." >&2
            exit 1
          fi

      - name: Checkout fork branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fork
          fetch-depth: 0
          ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}

      - id: sync
        name: Mirror main and rebase fork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "reason=main has commits that upstream does not. It must stay a pure mirror." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git push origin upstream/main:refs/heads/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rebase upstream/main; then
            {
              echo "reason<<EOF"
              echo "Rebasing fork onto upstream main stopped on a conflict:"
              echo
              git status --short | sed 's/^/    /'
              echo EOF
            } >> "$GITHUB_OUTPUT"
            git rebase --abort
            exit 1
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        if: steps.sync.outputs.moved == 'true'
        uses: ./.github/actions/setup-ci-deps

      - name: Typecheck the rebased branch
        if: steps.sync.outputs.moved == 'true'
        run: vp run typecheck

      - name: Push fork branch
        if: steps.sync.outputs.moved == 'true'
        run: git push --force-with-lease=fork:origin/fork origin HEAD:refs/heads/fork

      - name: Publish a nightly
        if: steps.sync.outputs.moved == 'true' && (github.event_name == 'schedule' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-release.yml --ref fork

      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.sync.outputs.reason }}
        run: |
          set -euo pipefail
          title="Upstream sync failed"
          body="$(printf '%s\n\nRun: %s/%s/actions/runs/%s\n\nFollow the fork-sync skill to rebase by hand.' \
            "${REASON:-The sync job failed before or after the rebase; see the run log.}" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
